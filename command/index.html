:root { color-scheme: light; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { min-height: 100vh; overflow-x: hidden; color: #f3ead2; font: 16px/1.5 'Archivo', system-ui, sans-serif; background-color: #3b2819; }
html { background-color: #2a1c12; background-image: var(--table, none); background-size: 640px 640px; background-repeat: repeat; }
html.photo body { background: transparent; }
body { background-color: transparent !important; background-image: none !important; }
body::before { content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none; background: radial-gradient(ellipse at 50% 30%, rgba(255,230,190,.12), rgba(0,0,0,.6) 85%); }
header { text-align: center; padding: 58px 16px 10px; position: relative; text-shadow: 0 2px 6px rgba(0,0,0,.7); }
.kick { font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: .3em; text-transform: uppercase; opacity: .8; }
header h1 { margin: 6px 0 0; font-weight: 800; font-size: clamp(30px, 6vw, 54px); letter-spacing: .05em; text-transform: uppercase; }
header p { max-width: 640px; margin: 10px auto 0; font-size: 17px; }
.taal { position: absolute; top: 12px; right: 12px; border: 0; color: #2f2a1c; padding: 8px 14px; border-radius: 999px; cursor: pointer; font: 700 14px system-ui, sans-serif; min-height: 40px;
  background: linear-gradient(#fbf6e6, #ece2c2); box-shadow: 0 2px 0 rgba(0,0,0,.35), 0 4px 10px rgba(0,0,0,.35); }
main { max-width: 1180px; margin: 0 auto; padding: 22px 16px 10px; display: grid; gap: 34px 26px; grid-template-columns: repeat(3, 1fr); }
.kaart { display: flex; flex-direction: column; gap: 18px; text-decoration: none; color: inherit; }
.lid { display: block; border-radius: 6px; overflow: hidden; line-height: 0; transform: perspective(1400px) rotateX(18deg) rotate(var(--r, 0deg)); transform-origin: 50% 100%;
  box-shadow: 0 12px 0 -3px var(--edge), 0 13px 0 -3px rgba(0,0,0,.6), 0 30px 40px rgba(0,0,0,.6); transition: transform .2s; }
.lid > svg { width: 100%; height: auto; display: block; }
.lid.photo { transform: rotate(var(--r, 0deg)); box-shadow: none; border-radius: 0; overflow: visible; position: relative; container-type: inline-size; }
.lid.photo img { width: 100%; height: auto; display: block;
  -webkit-mask-image: linear-gradient(to right, transparent, #000 7%, #000 93%, transparent), linear-gradient(to bottom, transparent, #000 7%, #000 93%, transparent);
  -webkit-mask-composite: source-in; mask-image: linear-gradient(to right, transparent, #000 7%, #000 93%, transparent), linear-gradient(to bottom, transparent, #000 7%, #000 93%, transparent); mask-composite: intersect; }
.kaart:hover .lid.photo, .kaart:focus-visible .lid.photo { transform: rotate(var(--r, 0deg)) translateY(-6px); }
.lid-title { position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; line-height: 1; pointer-events: none; white-space: nowrap; }
.lid-title b { font-size: 5.2cqw; letter-spacing: .06em; text-transform: uppercase; font-weight: 800; }
.lid-title small { font-family: 'IBM Plex Mono', monospace; font-size: 1.3cqw; letter-spacing: .3em; margin-top: .45em; font-weight: 600; opacity: .9; }
.lt-romaterra { left: 23.5%; top: 15.6%; width: 47%; height: 11.5%; transform: rotate(-5.2deg) skewX(-5deg); color: #fbe7ae; text-shadow: 0 1px 0 #5a1a10, 0 2px 6px rgba(0,0,0,.45); }
.lt-romaterra b { font-family: 'Cinzel', Georgia, serif; font-weight: 700; font-size: 4.6cqw; }
.lt-ironfront { left: 17%; top: 11.8%; width: 67%; height: 9.5%; color: #efe4c2; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
.lt-terrastate { left: 19%; top: 9%; width: 61%; height: 12%; color: #eafcff; text-shadow: 0 0 8px #3fe6ff, 0 0 2px #3fe6ff; }
.kaart:hover .lid, .kaart:focus-visible .lid { transform: perspective(1400px) rotateX(12deg) rotate(var(--r, 0deg)) translateY(-6px); }
.k-ironfront { --r: -1.5deg; --edge: #403b28; } .k-romaterra { --r: 1deg; --edge: #7a2a1c; } .k-terrastate { --r: -.8deg; --edge: #2c343e; }
.body { background: linear-gradient(160deg, #fffdf6, #ece2c2); color: #2f2a1c; border-radius: 8px; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px; flex: 1;
  box-shadow: 0 0 0 1px rgba(0,0,0,.12), 0 3px 0 rgba(0,0,0,.2), 0 10px 18px rgba(0,0,0,.35); position: relative; }
.body::before { content: ''; position: absolute; inset: 5px; border: 1.5px solid rgba(47,42,28,.25); border-radius: 5px; pointer-events: none; }
.fam { font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: #9b3b26; font-weight: 600; }
.kaart h2 { margin: 0; font-size: 26px; line-height: 1.1; }
.k-romaterra h2 { font-family: 'Cinzel', Georgia, serif; }
.kaart p { margin: 0; font-size: 15.5px; }

<script>
(function () {
  var KEY = 'command-portal-taal', lang = 'en';
  try { lang = localStorage.getItem(KEY) === 'nl' ? 'nl' : 'en'; } catch (e) {}
  function apply() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-en]').forEach(function (el) { el.innerHTML = el.getAttribute('data-' + lang); });
    document.getElementById('taal').textContent = lang === 'en' ? 'Nederlands' : 'English';
  }
  document.getElementById('taal').addEventListener('click', function () { lang = lang === 'en' ? 'nl' : 'en'; try { localStorage.setItem(KEY, lang); } catch (e) {} apply(); });
  apply();
  try {
    if (window.HC_WOOD) { document.documentElement.style.setProperty('--table', 'url(' + HC_WOOD + ')'); document.documentElement.classList.add('photo'); }
    else document.documentElement.style.setProperty('--table', 'url(' + HCArt.tableTexture('ironfront', 900, 900).toDataURL('image/jpeg', .82) + ')');
  } catch (e) {}
  function lids() {
    document.querySelectorAll('.lid').forEach(function (el) {
      var w = el.getAttribute('data-w'), nl = lang === 'nl';
      var names = { ironfront: ['Sealed Orders', 'Verzegelde Orders', 'Ironfront'], romaterra: ['Veiled Legions', 'Gesluierde Legioenen', 'Romaterra'], terrastate: ['Hidden Command', 'Verborgen Commando', 'Terrastate'] }[w];
      var title = nl ? names[1] : names[0], ed = (nl ? names[2] + '-EDITIE' : names[2] + ' EDITION').toUpperCase();
      if (window.HC_LIDS && HC_LIDS[w]) {
        // the rendered box lid, with the title printed in our own type
        el.classList.add('photo');
        el.innerHTML = '<img src="' + HC_LIDS[w] + '" alt=""><span class="lid-title lt-' + w + '"><b></b><small></small></span>';
        el.querySelector('b').textContent = title; el.querySelector('small').textContent = ed;
      } else el.innerHTML = HCArt.boxArt(w, { title: title, edition: ed, players: nl ? '1 of 2 spelers' : '1 or 2 players', time: nl ? 'ongeveer 10 tot 15 minuten' : 'about 10 to 15 minutes' });
    });
  }
  lids();
  document.getElementById('taal').addEventListener('click', lids);
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () {});
})();
</script>
