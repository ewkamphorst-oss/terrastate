<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Heroes: the commanders of Terrastate, Romaterra and Ironfront</title>
<meta name="description" content="Short stories about the six first commanders of each world in Terrastate, Romaterra and Ironfront, and the rest of the staff: who they are, where they came from and why they fight.">
<link rel="canonical" href="https://playterrastate.nl/world/heroes.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Terrastate">
<meta property="og:title" content="Heroes: the commanders of Terrastate, Romaterra and Ironfront">
<meta property="og:description" content="Short stories about the six first commanders of each world in Terrastate, Romaterra and Ironfront, and the rest of the staff: who they are, where they came from and why they fight.">
<meta property="og:image" content="https://playterrastate.nl/world/img/ts-hero.jpg">
<meta name="theme-color" content="#0b0f17">
<link rel="icon" href="../icons/terrastate-64.png">
<link rel="stylesheet" href="world.css?v=3">
<script data-goatcounter="https://playterrastatenl.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<div id="top"></div>
<header class="hero" id="hero"><div class="wrap"><div class="kick" id="kick"></div><h1 id="h1"></h1><p class="lead">They sit in your staff in the game and give your nation their bonus. Here you get to know them. Six short stories for the six first commanders, then the rest of the staff.</p></div></header>
<main><section><div class="wrap"><div id="sw"></div><div class="toc" id="toc"></div><div id="st"></div><div id="rest"></div></div></section></main>
<div id="foot"></div>
<script src="data.js?v=3"></script>
<script src="lore.js?v=3"></script>
<script src="lz.js?v=3"></script>
<script src="world.js?v=3"></script>
<script>

var P=PT,w=P.w,l=P.L[w],e=P.esc;document.getElementById('top').innerHTML=P.topbar('heroes.html');document.getElementById('foot').innerHTML=P.footer();
document.getElementById('sw').innerHTML=P.switcher('heroes.html');
document.getElementById('hero').style.backgroundImage='url(img/'+w+'-hero.jpg)';
document.getElementById('kick').textContent=l.era;document.getElementById('h1').textContent='The commanders of '+l.name;
var have=P.collected(),cm=P.deck().filter(function(x){return x.kind==='cmd';});
document.getElementById('toc').innerHTML=cm.map(function(x){return '<a href="#'+x.k+'">'+e(x.n)+'</a>';}).join('')+'<a href="#staff">The rest</a>';
document.getElementById('st').innerHTML=cm.map(function(x){var s=(l.cmd[x.k]||{}).story||{t:'',p:[]};
 return '<article class="story" id="'+x.k+'"><div class="cardwrap">'+P.cardHTML(x,{lock:!have[x.id]})+'</div><div><div class="who">'+e(x.n)+' · '+e(x.role)+'</div><h3>'+e(s.t)+'</h3>'+s.p.map(function(p){return '<p>'+e(p)+'</p>';}).join('')+
 '<p class="muted small" style="font-family:var(--sans)">In the game: '+e(x.d)+' at rank 1, growing with every rank'+(x.ord?'. Order, '+e(x.ord.n)+': '+e(x.ord.d):'')+'.</p></div></article>';}).join('');
var d=P.D[w],SN=d.staffName||'Staff',SR=d.roles||{},RO=['army','defense','economy','science','diplomacy','intel','grand'],ST=(d.staff||[]).filter(function(x){return !x.start;});
function sCard(x){var rk=x.rar==='c'?'Common':x.rar==='r'?'Rare':x.rar==='e'?'Epic':x.rar==='l'?'Legendary':'Supreme';
 return '<div class="sf"><div class="sp">'+(x.face?'<img src="img/'+e(x.face)+'" alt="'+e(x.n)+'" width="96" height="144" loading="lazy" onerror="this.style.display=\'none\'">':'')+'</div><div class="st"><b>'+e(x.n)+'</b><span class="tag">'+rk+'</span><div class="small muted">'+e(x.bio)+'</div><div class="small" style="margin-top:4px">Rank 1: '+e(x.b)+'</div><div class="small">Order, '+e(x.ord)+': '+e(x.od)+'</div><div class="small muted">Unlocked by: '+e(x.deed||'')+'</div></div></div>';}
document.getElementById('rest').innerHTML='<h2 id="staff" style="margin-top:34px;scroll-margin-top:80px">The rest of the '+e(SN.toLowerCase())+'</h2><p class="muted">The other '+ST.length+' commanders are unlocked by deeds during the season: take regions, hold off attacks, build, research, lead your nation through the season or rule many regions at once. They have no story yet, only a name, a face and a line.</p>'+RO.map(function(r){var L=ST.filter(function(x){return x.role===r;});return L.length?'<h4 class="sh">'+e(SR[r]||r)+'</h4><div class="sg">'+L.map(sCard).join('')+'</div>':'';}).join('');

</script>
</body>
</html>
